services:
  mysql:
    image: mysql:8.4
    container_name: hci-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hci}
      MYSQL_USER: ${MYSQL_USER:-hci_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: ./services/ai
    container_name: hci-ai
    restart: unless-stopped
    environment:
      HCI_SERVICE_TOKEN: ${HCI_SERVICE_TOKEN:?Set HCI_SERVICE_TOKEN in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-120}
      AI_CONTEXT_SIZE: ${AI_CONTEXT_SIZE:-2048}
    ports:
      - "127.0.0.1:8001:8001"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Start only when testing RAG. Keep Qdrant off during basic Gateway work on an 8 GB Mac.
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: hci-qdrant
    profiles: ["rag"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 512m

  # Optional Docker-based Ollama. Native Ollama on Apple Silicon is preferred for Metal acceleration.
  ollama:
    image: ollama/ollama:latest
    container_name: hci-ollama
    profiles: ["container-ollama"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mysql_data:
  qdrant_data:
  ollama_data:
